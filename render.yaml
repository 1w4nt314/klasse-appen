services:
  - type: web
    name: klasse-appen
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      # Fx https://klasse-appen.onrender.com — bruges i links i mails.
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
